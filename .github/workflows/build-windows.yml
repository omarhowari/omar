name: Build Windows

# Manual (Actions -> Build Windows -> Run workflow) or on a version tag (v1.5.0 ...)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -r requirements-dev.txt
          python -m tests.test_groups
          python -m tests.test_network
          python -m tests.test_update

      - name: NSIS
        run: choco install nsis -y --no-progress

      - name: Build TDA.exe + TDA-Setup.exe (Visual Studio compiler)
        shell: pwsh
        run: packaging\windows\build_windows.ps1 -Out dist

      - uses: actions/upload-artifact@v4
        with:
          name: TDA-windows
          path: |
            dist/TDA-Setup.exe
            dist/TDA-portable.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TDA-Setup.exe
            dist/TDA-portable.zip
