name: Build Windows

# Manual only: the published installer is built with packaging/windows/build_portable.sh
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Network self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tests.test_network

      - name: Build TDA.exe
        run: python -m PyInstaller --noconfirm --clean --windowed --name TDA --icon assets\tda.ico --add-data "assets;assets" --exclude-module tkinter main.py

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\TDA.iss
          Compress-Archive -Path dist\TDA -DestinationPath dist\TDA-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TDA-windows
          path: |
            dist/TDA-Setup-*.exe
            dist/TDA-portable.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TDA-Setup-*.exe
            dist/TDA-portable.zip
